name: Build

on:
  push:
    branches:
      - "logos/**"
    tags:
      - "v*-logos.*"
  pull_request:

jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            gmp_target: host
            gmp_package: package
          - arch: arm64
            runner: ubuntu-24.04-arm
            gmp_target: aarch64
            gmp_package: package_aarch64
    runs-on: ${{ matrix.runner }}
    # glibc 2.35, so the libs and programs work on older Linux too.
    container: ubuntu:22.04
    defaults:
      run:
        shell: bash
    env:
      SLUG: rapidsnark-linux-${{ matrix.arch }}-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
    steps:
      - name: install requirements
        run: |
          apt-get update
          apt-get install -y build-essential cmake m4 nasm git curl xz-utils jq bc

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: "recursive"

      - name: Cache gmp build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            depends/gmp
            depends/gmp-6.3.0.tar.xz
          key: ${{ runner.os }}-${{ runner.arch }}-ubuntu-22.04-gmp-${{ hashFiles('build_gmp.sh') }}

      - name: Build gmp
        run: if [[ ! -d "depends/gmp/${{ matrix.gmp_package }}" ]]; then ./build_gmp.sh ${{ matrix.gmp_target }}; fi

      - name: Build embeddable libs
        run: |
          make host_linux_${{ matrix.arch }}_embeddable
          cd build_prover_embeddable && ctest --output-on-failure

      - name: Build static prover and verifier
        run: |
          make host_linux_${{ matrix.arch }}_static
          cd build_prover && ctest --output-on-failure

      - name: Test rapidsnark
        run: |
          set -x
          set -e
          time package/bin/prover testdata/circuit_final.zkey testdata/witness.wtns proof.json public.json
          time package/bin/verifier testdata/verification_key.json public.json proof.json
          # make a wrong public.json by decrementing the first element by 1
          (value_0=$(jq '.[0]' public.json | tr -d '"') && value_0=$(echo "$value_0 - 1" | BC_LINE_LENGTH=100 bc) && jq --arg value_0 "$value_0" '.[0] = $value_0' public.json) > public_bad.json
          set +e
          time package/bin/verifier testdata/verification_key.json public_bad.json proof.json
          exit_code=$?
          set -e
          [ $exit_code -ne 0 ]

      - name: Package
        run: |
          set -x
          mkdir -p $SLUG/lib $SLUG/bin
          cp package_embeddable/lib/{librapidsnark,libfr,libfq,libgmp}.a $SLUG/lib/
          cp package/bin/{prover,verifier} $SLUG/bin/
          cp -r package_embeddable/include $SLUG/
          cp depends/gmp/${{ matrix.gmp_package }}/include/gmp.h $SLUG/include/
          echo "${{ github.ref_type == 'tag' && github.ref_name || github.sha }}" > $SLUG/VERSION
          tar -czf $SLUG.tar.gz $SLUG

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.SLUG }}
          path: ${{ env.SLUG }}.tar.gz
          if-no-files-found: error

  build-windows-x86_64:
    runs-on: ubuntu-24.04
    env:
      SLUG: rapidsnark-windows-x86_64-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: "recursive"

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: build
        run: nix build .#windows-x86_64-source -L

      - name: Package
        run: |
          set -x
          mkdir -p $SLUG/lib $SLUG/bin
          cp result/lib/{librapidsnark,libfr,libfq,libgmp}.a $SLUG/lib/
          cp result/bin/{prover,verifier}.exe $SLUG/bin/
          cp -r result/include $SLUG/
          echo "${{ github.ref_type == 'tag' && github.ref_name || github.sha }}" > $SLUG/VERSION
          tar -czf $SLUG.tar.gz $SLUG

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.SLUG }}
          path: ${{ env.SLUG }}.tar.gz
          if-no-files-found: error

  # The Windows build is cross-compiled on Linux, so it's tested here.
  test-windows-x86_64:
    needs: build-windows-x86_64
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      SLUG: rapidsnark-windows-x86_64-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ env.SLUG }}

      - name: Test rapidsnark
        run: |
          set -x
          set -e
          tar -xzf $SLUG.tar.gz
          time $SLUG/bin/prover.exe testdata/circuit_final.zkey testdata/witness.wtns proof.json public.json
          time $SLUG/bin/verifier.exe testdata/verification_key.json public.json proof.json
          # make a wrong public.json by decrementing the first element by 1
          python -c "import json; p=json.load(open('public.json')); p[0]=str(int(p[0])-1); json.dump(p, open('public_bad.json','w'))"
          set +e
          time $SLUG/bin/verifier.exe testdata/verification_key.json public_bad.json proof.json
          exit_code=$?
          set -e
          [ $exit_code -ne 0 ]

  build-apple:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      SLUG: rapidsnark-macOS-${{ matrix.arch }}-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: "recursive"

      - name: Cache gmp build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            depends/gmp
            depends/gmp-6.3.0.tar.xz
          key: ${{ runner.os }}-${{ runner.arch }}-gmp-${{ hashFiles('build_gmp.sh') }}

      - name: install dependencies
        if: matrix.arch == 'x86_64'
        run: |
          brew install nasm

      - name: build
        run: |
          if [[ ! -d "depends/gmp/package_macos_${{ matrix.arch }}" ]]; then ./build_gmp.sh macos_${{ matrix.arch }}; fi
          make macos_${{ matrix.arch }}
          cd build_prover_macos_${{ matrix.arch }} && ctest --rerun-failed --output-on-failure

      - name: test rapidsnark
        run: |
          set -x
          set -e
          time package_macos_${{ matrix.arch }}/bin/prover testdata/circuit_final.zkey testdata/witness.wtns proof.json public.json
          time package_macos_${{ matrix.arch }}/bin/verifier testdata/verification_key.json public.json proof.json
          # make a wrong public.json by decrementing the first element by 1
          (value_0=$(jq '.[0]' public.json | tr -d '"') && value_0=$(echo "$value_0 - 1" | BC_LINE_LENGTH=100 bc) && jq --arg value_0 "$value_0" '.[0] = $value_0' public.json) > public_bad.json
          set +e
          time package_macos_${{ matrix.arch }}/bin/verifier testdata/verification_key.json public_bad.json proof.json
          exit_code=$?
          set -e
          [ $exit_code -ne 0 ]

      - name: Package
        run: |
          set -x
          mkdir -p $SLUG/lib $SLUG/bin
          cp package_macos_${{ matrix.arch }}/lib/{librapidsnark,libfr,libfq,libgmp}.a $SLUG/lib/
          cp package_macos_${{ matrix.arch }}/bin/{prover,verifier} $SLUG/bin/
          cp -r package_macos_${{ matrix.arch }}/include $SLUG/
          cp depends/gmp/package_macos_${{ matrix.arch }}/include/gmp.h $SLUG/include/
          echo "${{ github.ref_type == 'tag' && github.ref_name || github.sha }}" > $SLUG/VERSION
          tar -czf $SLUG.tar.gz $SLUG

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.SLUG }}
          path: ${{ env.SLUG }}.tar.gz
          if-no-files-found: error

  # Runs on tag push only. Creates a draft release with every archive; publish it by hand.
  release:
    if: github.ref_type == 'tag'
    needs: [build-linux, test-windows-x86_64, build-apple]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -x
          prerelease=$([[ "$TAG" == *-rc* ]] && echo --prerelease || true)
          gh release create "$TAG" dist/*.tar.gz --repo ${{ github.repository }} --draft --verify-tag $prerelease --title "$TAG" --generate-notes
